<head>
<meta charset="utf-8">

<title>Ev 3D Gezinti</title>
<style>
  :root { --bg:#1b1e24; --panel:rgba(20,23,29,.92); --fg:#eef1f5; --mute:#9aa4b2; --acc:#4fb0ff; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--fg); font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif; overflow:hidden; }
  #c { display:block; width:100vw; height:100vh; touch-action:none; }
  .bar { position:fixed; top:12px; left:12px; display:flex; gap:6px; flex-wrap:wrap; z-index:2; }
  .bar button { background:var(--panel); color:var(--fg); border:1px solid #333a45; border-radius:8px; padding:8px 12px; font:inherit; cursor:pointer; }
  .bar button.on { border-color:var(--acc); color:var(--acc); }
  #info { position:fixed; right:12px; top:12px; width:min(340px, calc(100vw - 24px)); background:var(--panel); border:1px solid #333a45; border-radius:10px; padding:12px 14px; z-index:2; display:none; }
  #info h3 { margin:0 0 6px; font-size:15px; color:var(--acc); }
  #info table { border-collapse:collapse; width:100%; }
  #info td { padding:2px 0; vertical-align:top; } #info td:first-child { color:var(--mute); padding-right:10px; white-space:nowrap; }
  #help { position:fixed; left:12px; bottom:12px; background:var(--panel); border:1px solid #333a45; border-radius:10px; padding:8px 12px; color:var(--mute); font-size:12.5px; z-index:2; max-width:calc(100vw - 24px); }
  #pad { position:fixed; right:16px; bottom:16px; display:none; grid-template-columns:repeat(3,52px); gap:6px; z-index:2; }
  #pad button { height:52px; background:var(--panel); color:var(--fg); border:1px solid #333a45; border-radius:10px; font-size:20px; }
  @media (pointer:coarse) { #pad { display:grid; } }
  #err { position:fixed; inset:0; display:none; align-items:center; justify-content:center; text-align:center; padding:20px; }
</style>
</head>

// ---------------- camera modes ----------------
let mode = 'walk', yaw = 0, pitch = 0, pos = new THREE.Vector3(DATA.start[0], 160, -DATA.start[1]);
const orbit = { tx: 540, tz: -330, r: 1500, th: -0.6, ph: 0.95 };
function setMode(m) {
  mode = m; document.getElementById('mWalk').classList.toggle('on', m === 'walk'); document.getElementById('mTop').classList.toggle('on', m === 'top');
  setCeil(m === 'walk'); help();
  labels.forEach(l => { const w = m === 'walk'; l.scale.set(w ? 70 : 200, w ? 17.5 : 50, 1); l.material.depthTest = w; l.position.y = w ? 215 : 205; });
}
function setCeil(v) { ceils.forEach(c => c.visible = v); document.getElementById('tCeil').classList.toggle('on', v); }
function help() {
  document.getElementById('help').innerHTML = mode === 'walk'
    ? 'Gez: <b>W A S D</b> / ok tuşları ile yürü, sürükleyerek etrafa bak. Bir yüzeye <b>tıkla</b> → ölçüleri gör.'
    : 'Kuşbakışı: sürükle → döndür, sağ tık/Shift+sürükle → kaydır, tekerlek → yakınlaş. <b>Tıkla</b> → ölçüler.';
}
document.getElementById('mWalk').onclick = () => setMode('walk');
document.getElementById('mTop').onclick = () => setMode('top');
document.getElementById('tCeil').onclick = () => setCeil(!ceils[0].visible);
document.getElementById('tLbl').onclick = e => { const v = !labels[0].visible; labels.forEach(l => l.visible = v); e.target.classList.toggle('on', v); };

const keys = {};
addEventListener('keydown', e => { keys[e.key.toLowerCase()] = true; });
addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
document.querySelectorAll('#pad button').forEach(b => {
  const k = b.dataset.k; b.onpointerdown = e => { e.preventDefault(); keys['pad' + k] = true; };
  b.onpointerup = b.onpointerleave = () => { keys['pad' + k] = false; };
});

let drag = null;
canvas.addEventListener('contextmenu', e => e.preventDefault());
canvas.addEventListener('pointerdown', e => { drag = { x: e.clientX, y: e.clientY, sx: e.clientX, sy: e.clientY, btn: e.button, shift: e.shiftKey }; canvas.setPointerCapture(e.pointerId); });
canvas.addEventListener('pointermove', e => {
  if (!drag) return; const dx = e.clientX - drag.x, dy = e.clientY - drag.y; drag.x = e.clientX; drag.y = e.clientY;
  if (mode === 'walk') { yaw -= dx * 0.004; pitch = Math.max(-1.4, Math.min(1.4, pitch - dy * 0.004)); }
  else if (drag.btn === 2 || drag.shift) {
    const s = orbit.r / 800, c = Math.cos(orbit.th), si = Math.sin(orbit.th);
    orbit.tx -= (dx * c + dy * si) * s; orbit.tz -= (-dx * si + dy * c) * s;
  } else { orbit.th -= dx * 0.005; orbit.ph = Math.max(0.1, Math.min(1.5, orbit.ph - dy * 0.005)); }
});
canvas.addEventListener('pointerup', e => {
  const moved = drag && Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy) > 5; drag = null;
  if (!moved) pickAt(e.clientX, e.clientY);
});
canvas.addEventListener('wheel', e => { if (mode === 'top') { orbit.r = Math.max(150, Math.min(5000, orbit.r * (1 + Math.sign(e.deltaY) * 0.1))); e.preventDefault(); } }, { passive: false });

// collision: wall boxes as 2D AABBs (only those reaching eye height range)
const solidsXY = DATA.walls.concat(DATA.special, DATA.furn || []).filter(w => w.b[2] < 150 && w.b[5] > 40).map(w => w.b);
function blocked(x, y) { const r = 18; return solidsXY.some(b => x > b[0] - r && x < b[3] + r && y > b[1] - r && y < b[4] + r); }

// ---------------- picking / measuring ----------------
const ray = new THREE.Raycaster();
function roomAt(x, y) {
  for (const k in DATA.rooms) for (const r of DATA.rooms[k].rects) if (x >= r[0] && x <= r[2] && y >= r[1] && y <= r[3]) return [k, r];
  return null;
}
const f1 = v => (Math.round(v * 10) / 10).toString().replace('.', ',');
function show(title, rows) {
  document.getElementById('iT').textContent = title;
  document.getElementById('iB').innerHTML = rows.map(([a, b]) => `<tr><td>${a}</td><td>${b}</td></tr>`).join('');
  document.getElementById('info').style.display = 'block';
}
function pickAt(cx, cy) {
  const rect = canvas.getBoundingClientRect();
  ray.setFromCamera(new THREE.Vector2(((cx - rect.left) / rect.width) * 2 - 1, -((cy - rect.top) / rect.height) * 2 + 1), camera);
  const hits = ray.intersectObjects(pick.filter(o => o.visible));
  hlLine.visible = false;
  if (!hits.length) { document.getElementById('info').style.display = 'none'; hl.visible = false; return; }
  const h = hits[0], o = h.object, u = o.userData, b = u.b;
  hl.box.setFromObject(o); hl.visible = true;
  const n = h.face.normal.clone().transformDirection(o.matrixWorld);
  const px = h.point.x, py = -h.point.z, nx = Math.round(n.x), ny = Math.round(-n.z);
  const dims = [['Parça', f1(b[3] - b[0]) + ' × ' + f1(b[4] - b[1]) + ' cm, yükseklik ' + f1(b[5] - b[2])]];
  if (u.kind === 'wall' || u.kind === 'col') {
    if (nx === 0 && ny === 0) { show(u.kind === 'col' ? u.name : 'Duvar (üst yüz)', dims); return; }
    const side = roomAt(px + nx * 6, py + ny * 6);
    // thickness: cast from just inside the wall back through it
    const dir = new THREE.Vector3(-n.x, 0, -n.z).normalize();
    const r2 = new THREE.Raycaster(h.point.clone().addScaledVector(dir, 0.05), dir, 0, 400);
    const th = r2.intersectObjects(walls)[0];
    const rows = [];
    let title = u.kind === 'col' ? u.name : 'Duvar';
    if (side) {
      const [k, r] = side, R = DATA.rooms[k];
      const along = nx !== 0 ? r[3] - r[1] : r[2] - r[0], across = nx !== 0 ? r[2] - r[0] : r[3] - r[1];
      title += ' — ' + R.name;
      rows.push(['Bu duvarın uzunluğu', f1(along) + ' cm (iç ölçü)']);
      rows.push(['Karşı duvara', f1(across) + ' cm']);
      // segment line along the wall face
      const a = nx !== 0 ? [P(px, r[1]), P(px, r[3])] : [P(r[0], py), P(r[2], py)];
      a.forEach(v => v.y = h.point.y); hlLine.geometry.setFromPoints(a); hlLine.visible = true;
      rows.push(['Tavan yüksekliği', f1(R.ceiling) + ' cm']);
      rows.push(['Oda', R.name + ' ' + f1(R.w) + ' × ' + f1(R.d) + ' cm']);
      rows.push(['Tavan notu', R.note]);
    } else rows.push(['Konum', 'Dış yüz']);
    rows.push(['Duvar kalınlığı', th ? f1(th.distance + 0.05) + ' cm' : '—']);
    rows.push(['Tıklanan nokta', 'yerden ' + f1(h.point.y) + ' cm']);
    show(title, rows.concat(u.kind === 'col' ? dims : []));
  } else if (u.kind === 'floor') {
    const R = DATA.rooms[u.room];
    show(R.name, [['Ölçü', f1(R.w) + ' × ' + f1(R.d) + ' cm'], ['Tavan', f1(R.ceiling) + ' cm'], ['Tavan notu', R.note]]);
  } else show(u.info.split(':')[0], [['Bilgi', u.info.split(':').slice(1).join(':').trim()]].concat(dims));
}

// ---------------- loop ----------------
function resize() { const w = innerWidth, h = innerHeight; renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();
let last = performance.now();
function tick(t) {
  const dt = Math.min(0.05, (t - last) / 1000); last = t;
  if (mode === 'walk') {
    let f = 0, s = 0;
    if (keys.w || keys.arrowup || keys.padf) f += 1; if (keys.s || keys.arrowdown || keys.padb) f -= 1;
    if (keys.d || keys.padr) s += 1; if (keys.a || keys.padl) s -= 1;
    if (keys.arrowleft) yaw += 1.8 * dt; if (keys.arrowright) yaw -= 1.8 * dt;
    const sp = 160 * dt, fx = -Math.sin(yaw), fz = -Math.cos(yaw);
    const mx = (fx * f - fz * s) * sp, mz = (fz * f + fx * s) * sp;
    if (!blocked(pos.x + mx, -pos.z)) pos.x += mx;
    if (!blocked(pos.x, -(pos.z + mz))) pos.z += mz;
    camera.position.copy(pos);
    camera.rotation.set(pitch, yaw, 0, 'YXZ');
  } else {
    camera.position.set(orbit.tx + orbit.r * Math.sin(orbit.ph) * Math.sin(orbit.th), orbit.r * Math.cos(orbit.ph), orbit.tz + orbit.r * Math.sin(orbit.ph) * Math.cos(orbit.th));
    camera.lookAt(orbit.tx, 0, orbit.tz);
  }
  renderer.render(scene, camera); requestAnimationFrame(tick);
}
setMode('walk'); requestAnimationFrame(tick);
</script>
